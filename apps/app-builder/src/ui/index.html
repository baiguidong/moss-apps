<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>应用构建</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="style.css"></head>
<body class="app-shell">
  <main>
    <section class="intro"><h1>你想创建什么 App？</h1><p>描述你的想法，或选择技能和助手，把已有能力变成 App。</p></section>
    <form id="create" class="compose">
      <label for="requirements" class="sr-only">描述你的 App</label>
      <div class="input-area">
        <textarea id="requirements" rows="5" maxlength="4000" placeholder="描述你想创建的 App，使用 @ 添加技能或助手" aria-autocomplete="list" aria-controls="mention-results" aria-expanded="false"></textarea>
        <div id="mentions" class="mentions" hidden>
          <div class="tabs" role="tablist" aria-label="引用资源类型"><button type="button" role="tab" data-mention-tab="skill">技能</button><button type="button" role="tab" data-mention-tab="assistant">助手</button></div>
          <div id="mention-results" class="resource-list" role="listbox" aria-label="技能和助手"></div>
          <div class="mention-hint">↑ ↓ 选择 · Enter 添加 · Tab 切换 · Esc 关闭</div>
        </div>
      </div>
      <div id="selected-resources" class="selected-resources" aria-label="已选资源" hidden></div>
      <div class="compose-bottom"><button id="choose-resources" type="button" class="resource-trigger"><span data-icon="filter"></span>选择资源<span id="selection-count" class="count" hidden></span></button><button id="submit" type="submit" class="primary">开始创建<span data-icon="arrow"></span></button></div>
    </form>
    <p class="compose-hint">技能可多选，助手可选一个。创建后，在会话中继续完善。</p>
    <div id="notice" role="status" hidden></div>
    <section class="projects-section"><div class="section-title"><h2>继续项目</h2><span id="project-count" class="muted"></span><button id="refresh" type="button" class="ghost"><span data-icon="refresh"></span>刷新项目</button></div><div id="projects" class="projects"><p class="empty muted">正在加载项目…</p></div></section>
  </main>
  <dialog id="resource-picker" aria-labelledby="picker-title" aria-describedby="picker-description">
    <div class="picker-header"><span class="picker-icon" data-icon="filter"></span><div><h2 id="picker-title">选择资源</h2><p id="picker-description">选择创建 App 所需的技能和助手</p></div><button id="close-picker" type="button" class="icon-button" aria-label="关闭"><span data-icon="close"></span></button></div>
    <div class="search-field"><span data-icon="search"></span><input id="resource-search" type="search" placeholder="搜索已安装技能" aria-label="搜索资源" autocomplete="off"></div>
    <div class="tabs" role="tablist" aria-label="资源类型"><button id="tab-skill" type="button" role="tab" data-resource-tab="skill" aria-controls="resource-results"><span data-icon="skill"></span>技能</button><button id="tab-assistant" type="button" role="tab" data-resource-tab="assistant" aria-controls="resource-results"><span data-icon="assistant"></span>助手</button></div>
    <div id="resource-results" class="resource-list" role="tabpanel"></div>
    <footer class="picker-footer"><span id="resource-total" class="muted"></span><button id="confirm-resources" type="button" class="primary">确定</button></footer>
  </dialog>
  <script type="module" src="main.mjs"></script>
</body></html>
