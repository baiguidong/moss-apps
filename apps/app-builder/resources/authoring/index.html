<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>示例应用</title>
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./ui.css">
</head>
<body>
  <!-- Moss supplies App identity and management controls. Replace these example
       sections with real inputs/results; keep the page focused on the task. -->
  <main class="app-shell workspace" aria-label="示例应用工作区">
    <div class="workspace-toolbar" data-app-toolbar>
      <div class="toolbar-context"><h2>文本处理</h2><span id="status" role="status">准备输入内容</span></div>
      <div class="toolbar-actions">
        <button id="open-settings" type="button" data-app-secondary-action>设置</button>
        <!-- Replace with a real declared Action before shipping the target App. -->
        <button id="run" class="primary" type="button" disabled>开始处理</button>
      </div>
    </div>
    <div class="workspace-content" data-app-primary>
      <section class="panel" aria-labelledby="input-title">
        <div class="panel-heading"><h3 id="input-title">输入内容</h3></div>
        <label class="editor-field"><span class="sr-only">待处理文本</span><textarea id="input" rows="8" placeholder="输入待处理文本"></textarea></label>
      </section>
      <section class="panel result-panel" aria-labelledby="result-title">
        <div class="panel-heading"><h3 id="result-title">处理结果</h3></div>
        <div id="result" class="result-content"><p class="muted">处理完成后在这里查看结果。</p></div>
      </section>
    </div>
  </main>
  <dialog id="settings" aria-labelledby="settings-title">
    <div class="panel-heading"><h2 id="settings-title">处理设置</h2><button id="close-settings" type="button">关闭</button></div>
    <!-- Replace this example with real optional settings; keep required inputs in the workspace. -->
    <p class="muted">在这里放置不常用的处理选项。</p>
  </dialog>
  <script type="module" src="./ui.mjs"></script>
</body>
</html>
