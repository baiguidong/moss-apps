<style>
#growth-demo{--g-text:light-dark(#23362a,#e3eee6);--g-muted:light-dark(#58695d,#a9beb0);--g-line:light-dark(#dce6df,#3b4f42);--g-accent:light-dark(#26794b,#8dd8a7);--g-soft:light-dark(#edf5ef,#243b2b);color:var(--g-text);max-width:840px;margin:auto;font:14px/1.65 system-ui,sans-serif}#growth-demo *{box-sizing:border-box}#growth-demo h2{font-size:23px;margin:0 0 8px}#growth-demo p{color:var(--g-muted);margin:8px 0}#growth-demo .controls{display:flex;gap:20px;flex-wrap:wrap;border-block:1px solid var(--g-line);padding:18px 0;margin:18px 0}#growth-demo label{display:block;flex:1;min-width:140px;margin:0}#growth-demo input{padding:0;border:0;display:block;width:100%;accent-color:var(--g-accent);margin-top:8px}#growth-demo output{font-variant-numeric:tabular-nums}#growth-demo .total{font-size:30px;font-weight:600;color:var(--g-text)}#growth-demo .bars{display:flex;height:170px;gap:7px;align-items:end;border-bottom:1px solid var(--g-line);padding-top:20px}#growth-demo .bar{background:var(--g-accent);flex:1;border-radius:4px 4px 0 0;min-width:0}#growth-demo .axis{display:flex;justify-content:space-between;color:var(--g-muted);font-size:12px;margin-top:6px}#growth-demo button{background:var(--g-soft);border:1px solid var(--g-line);color:var(--g-text);border-radius:7px;padding:8px 12px;font:inherit;margin-top:18px}#growth-demo .note{font-size:12px}#growth-demo button:focus-visible,#growth-demo input:focus-visible{outline:2px solid var(--g-accent);outline-offset:3px}
</style>
<section id="growth-demo" aria-label="复利增长演示">
<h2>时间如何放大复利</h2><p>以 10 万元本金为例，调节年化收益率与持有年数。</p>
<div class="controls"><label>年化收益率 <output id="rate-label">5%</output><input id="growth-rate" aria-label="年化收益率" type="range" min="0" max="15" value="5" step="0.5"></label><label>持有年数 <output id="years-label">10 年</output><input id="growth-years" aria-label="持有年数" type="range" min="1" max="30" value="10"></label></div>
<p>期末金额</p><output id="growth-total" class="total" aria-live="polite"></output><div id="growth-bars" class="bars" role="img" aria-label="本金随年份增长"></div><div class="axis"><span>第 0 年</span><span id="growth-axis"></span></div>
<p class="note">示例计算：收益每年复投，未计税费、通胀和收益波动。</p>
</section>
<script>
(()=>{const root=document.getElementById('growth-demo'),api=window.mossVisualization;const $=id=>root.querySelector('#'+id);const state={rate:5,years:10};
function restore(v){if(v&&Number.isFinite(v.rate)&&Number.isFinite(v.years)){state.rate=Math.max(0,Math.min(15,v.rate));state.years=Math.round(Math.max(1,Math.min(30,v.years)));}}
function render(){const values=Array.from({length:state.years+1},(_,i)=>10*Math.pow(1+state.rate/100,i)),max=values.at(-1);$('growth-rate').value=state.rate;$('growth-years').value=state.years;$('rate-label').textContent=state.rate+'%';$('years-label').textContent=state.years+' 年';$('growth-total').textContent=max.toFixed(2)+' 万元';$('growth-axis').textContent='第 '+state.years+' 年';$('growth-bars').replaceChildren(...values.map((v,i)=>{const bar=document.createElement('div');bar.className='bar';bar.style.height=(v/max*145)+'px';bar.title='第 '+i+' 年：'+v.toFixed(2)+' 万元';return bar;}));$('growth-bars').setAttribute('aria-label',state.years+' 年后金额 '+max.toFixed(2)+' 万元');}
restore(api?.getState());render();for(const [id,key]of[['growth-rate','rate'],['growth-years','years']])$(id).addEventListener('input',e=>{state[key]=Number(e.target.value);render();api?.setState(state);});window.addEventListener('moss:state',e=>{restore(e.detail);render();});})();
</script>
