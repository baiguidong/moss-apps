name: Verify Linux Native Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [moss.image-tools, moss.pdf-tools, moss.transcription, moss.file-cleaner, moss.document-converter, moss.code-map]
    env:
      MOSS_BUILD_DEPENDENCY_CACHE: ${{ github.workspace }}/.cache/moss-build-dependencies
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --filter moss-apps --filter '@moss/engine-apps'
      - uses: actions/cache@v4
        with:
          path: ${{ env.MOSS_BUILD_DEPENDENCY_CACHE }}
          key: Linux-linux-x64-bundled-engines-v2-${{ matrix.app }}-${{ hashFiles('apps/*/resources/engine.json', 'apps/document-converter/resources/pdf-engine.json', 'apps/*/resources/ff*.json', 'apps/transcription/resources/model.json') }}
      - name: Build source snapshot and validate package runtime
        env:
          APP_ID: ${{ matrix.app }}
        run: node scripts/package-app.mjs --app "$APP_ID" --platform linux-x64
      - name: Run real tasks with external networking disabled
        env:
          APP_ID: ${{ matrix.app }}
        run: node scripts/verify-bundled-apps.mjs --app "$APP_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-native-${{ matrix.app }}
          path: artifacts/offline-apps/*.json
