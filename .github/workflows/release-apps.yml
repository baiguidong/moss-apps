name: Windows Native Diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --filter moss-apps --filter '@moss/computer-use-app'
      - run: node scripts/package-app.mjs --app moss.computer-use --platform win32-x64
      - name: Report desktop context
        shell: pwsh
        run: |
          Get-Process -Id $PID | Select-Object Id,ProcessName,SessionId
          [System.Environment]::UserInteractive
      - name: Native Electron capture and input
        shell: bash
        env:
          MOSS_NATIVE_TEST_TRANSPORT: mcp
        run: |
          git -C vendor/moss-core apply "$GITHUB_WORKSPACE/windows-native-test.patch"
          cd vendor/moss-core/ui
          bun install --frozen-lockfile
          node node_modules/electron/cli.js tests/native-control.electron.mjs --package="$GITHUB_WORKSPACE/artifacts/moss.computer-use/0.2.1/package-win32-x64"
