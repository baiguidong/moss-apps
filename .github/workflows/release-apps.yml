name: Verify cross-platform settings rebuild
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --filter moss-apps --filter '@moss/app-builder'
      - run: node scripts/package-app.mjs --app moss.app-builder
      - uses: actions/upload-artifact@v4
        with:
          name: linux-source-package
          path: artifacts/**/*.zip
  rebuild:
    needs: pack
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --filter moss-apps
      - uses: actions/download-artifact@v4
        with:
          name: linux-source-package
          path: artifacts
      - run: node scripts/verify-source-package.mjs --app moss.app-builder --rebuild
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: settings-byte-differences
          path: diagnostics
