name: Diagnose Windows settings rebuild
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --filter moss-apps
      - uses: actions/download-artifact@v4
        with:
          name: source-packages
          path: artifacts
          run-id: 38347616640
          github-token: ${{ github.token }}
      - run: node scripts/verify-source-package.mjs --app moss.app-builder --rebuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-byte-differences
          path: diagnostics
