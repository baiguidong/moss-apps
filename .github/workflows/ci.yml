name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: moss-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run check
      - run: bun run test
      - name: Verify signed configuration App release in an isolated fixture
        run: node scripts/verify-release-smoke.mjs
      - run: node scripts/run-apps.mjs build --supported-platform linux-x64
      - name: Install browser for developer tools checks
        working-directory: apps/devtools
        run: bun x playwright install --with-deps chromium
      - name: Verify developer tools UI and local HTTP requests
        working-directory: apps/devtools
        run: bun run test:browser
      - name: Verify Trace UI and App data reader
        working-directory: apps/trace
        run: bun run test:browser
      - name: Verify MCP connection management UI
        working-directory: apps/mcp
        run: bun run test:browser
      - name: Verify Audit UI and local database
        working-directory: apps/audit
        run: bun run test:browser
      - name: Package exact source snapshots and verify final archives
        run: node scripts/package-app.mjs --supported-platform linux-x64
      - name: Rebuild installed source without repository dependencies
        run: node scripts/verify-source-package.mjs --rebuild --supported-platform linux-x64
      - name: Verify Audit package with the pinned Core Host
        run: node apps/audit/scripts/verify-package.mjs
      - name: Verify Workflow package with the pinned Core Host
        run: |
          node apps/workflow/scripts/verify-package.mjs
          node apps/workflow/scripts/review-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: source-packages
          path: artifacts/**/*.zip
  source-platforms:
    needs: validate
    env:
      MOSS_BUILD_DEPENDENCY_CACHE: ${{ github.workspace }}/.cache/moss-build-dependencies
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: source-packages
          path: artifacts
      - name: Cache pinned CLI, MCP and model build dependencies
        if: matrix.platform == 'darwin-arm64'
        uses: actions/cache@v4
        with:
          path: ${{ env.MOSS_BUILD_DEPENDENCY_CACHE }}
          key: ${{ runner.os }}-${{ matrix.platform }}-bundled-engines-v1-${{ hashFiles('apps/*/resources/engine.json', 'apps/document-converter/resources/pdf-engine.json', 'apps/file-cleaner/resources/ff*.json', 'apps/transcription/resources/model.json') }}
      - name: Build native packages on their supported desktop platform
        run: node scripts/package-app.mjs --platform-packages --supported-platform ${{ matrix.platform }}
      - name: Verify six local Apps with empty data and no external network
        if: matrix.platform == 'darwin-arm64'
        run: node scripts/verify-bundled-apps.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'darwin-arm64'
        with:
          name: offline-local-app-checks
          path: artifacts/offline-apps/*.json
      - name: Verify source rebuild and packaged Backend on each desktop platform
        run: node scripts/verify-source-package.mjs --rebuild --supported-platform ${{ matrix.platform }}
      - name: Upload verified native App archives
        uses: actions/upload-artifact@v4
        with:
          name: source-packages-${{ matrix.platform }}
          path: artifacts/**/*-${{ matrix.platform }}.zip
