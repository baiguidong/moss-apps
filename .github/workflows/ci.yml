name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - name: Install browser for developer tools checks
        working-directory: apps/devtools
        run: bun x playwright install --with-deps chromium
      - name: Verify developer tools UI
        working-directory: apps/devtools
        run: bun run test:browser
      - run: bun run package -- --skip-build
