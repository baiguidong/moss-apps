name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - name: Install browser for developer tools checks
        working-directory: apps/devtools
        run: bun x playwright install --with-deps chromium
      - name: Verify developer tools UI
        working-directory: apps/devtools
        run: bun run test:browser
      - name: Verify HTTP client UI and local requests
        working-directory: apps/http-client
        run: bun run test:browser
      - name: Verify Trace UI and App data reader
        working-directory: apps/trace
        run: bun run test:browser
      - name: Verify MCP connection management UI
        working-directory: apps/mcp
        run: bun run test:browser
      - name: Verify Audit UI and local database
        working-directory: apps/audit
        run: bun run test:browser
      - run: bun run package -- --skip-build
      - name: Verify Audit package with the pinned Core Host
        run: node apps/audit/scripts/verify-package.mjs
      - name: Verify Workflow package with the pinned Core Host
        run: |
          node apps/workflow/scripts/verify-package.mjs
          node apps/workflow/scripts/review-package.mjs
