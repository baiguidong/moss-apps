name: Release App

on:
  push:
    tags:
      - 'moss.*-v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: moss-app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - id: release
        run: node scripts/release-context.mjs "${{ github.ref_name }}"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - run: bun install --frozen-lockfile --filter moss-apps --filter "${{ steps.release.outputs.package_name }}"
      - name: Validate source and runtime on the target desktop platform
        run: node scripts/package-app.mjs --app "${{ steps.release.outputs.app_id }}"
      - name: Rebuild final archive independently
        run: node scripts/verify-source-package.mjs --app "${{ steps.release.outputs.app_id }}" --rebuild
  release:
    needs: source-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - id: release
        run: node scripts/release-context.mjs "$GITHUB_REF_NAME"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - run: bun install --frozen-lockfile --filter moss-apps --filter "${{ steps.release.outputs.package_name }}"
      - run: node scripts/validate-apps.mjs --app "${{ steps.release.outputs.app_id }}"
      - run: node scripts/run-apps.mjs check --app "${{ steps.release.outputs.app_id }}"
      - run: node scripts/run-apps.mjs test --app "${{ steps.release.outputs.app_id }}"
      - name: Verify developer tools UI and local HTTP requests
        if: steps.release.outputs.app_id == 'moss.devtools'
        working-directory: apps/devtools
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Verify Trace UI and App data reader
        if: steps.release.outputs.app_id == 'moss.trace'
        working-directory: apps/trace
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Verify MCP connection management UI
        if: steps.release.outputs.app_id == 'moss.mcp'
        working-directory: apps/mcp
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Verify Audit UI and local database
        if: steps.release.outputs.app_id == 'moss.audit'
        working-directory: apps/audit
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Build signed App package
        env:
          MOSS_APP_SIGNING_PRIVATE_KEY: ${{ secrets.MOSS_APP_SIGNING_PRIVATE_KEY }}
          MOSS_APP_SIGNING_KEY_ID: release-1
          MOSS_APP_PUBLISHED_AT: ${{ github.event.head_commit.timestamp }}
        run: node scripts/package-app.mjs --app "${{ steps.release.outputs.app_id }}" --require-signature
      - name: Verify signed Audit package with the pinned Core Host
        if: steps.release.outputs.app_id == 'moss.audit'
        run: node apps/audit/scripts/verify-package.mjs --require-signature
      - name: Verify signed Workflow package with the pinned Core Host
        if: steps.release.outputs.app_id == 'moss.workflow'
        run: |
          node apps/workflow/scripts/verify-package.mjs --require-signature
          node apps/workflow/scripts/review-package.mjs --require-signature
      - name: Verify signed ZIP source and independent rebuild
        run: node scripts/verify-source-package.mjs --app "${{ steps.release.outputs.app_id }}" --rebuild --require-signature
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ steps.release.outputs.app_id }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          root="artifacts/$APP_ID/$VERSION"
          gh release create "$GITHUB_REF_NAME" \
            "$root/$APP_ID-$VERSION.zip" \
            "$root/$APP_ID-$VERSION.sha256" \
            "$root/$APP_ID-$VERSION.release.json" \
            --title "$APP_ID v$VERSION" \
            --notes-file "${{ steps.release.outputs.app_dir }}/CHANGELOG.md" \
            --verify-tag
