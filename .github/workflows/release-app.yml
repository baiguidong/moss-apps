name: Release App

on:
  workflow_call:
    inputs:
      app_id:
        required: true
        type: string
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      MOSS_APP_SIGNING_PRIVATE_KEY:
        required: true

permissions:
  contents: write

concurrency:
  group: moss-app-release-${{ inputs.app_id }}
  cancel-in-progress: false

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.release.outputs.platforms }}
      variants: ${{ steps.release.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --filter moss-apps
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.app_id }}-v${{ inputs.version }}
        run: node scripts/release-context.mjs "$RELEASE_TAG"
  source-platforms:
    needs: context
    env:
      MOSS_BUILD_DEPENDENCY_CACHE: ${{ github.workspace }}/.cache/moss-build-dependencies
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.context.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --filter moss-apps
      - id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.app_id }}-v${{ inputs.version }}
        run: node scripts/release-context.mjs "$RELEASE_TAG"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - run: bun install --frozen-lockfile --filter moss-apps --filter "${{ steps.release.outputs.package_name }}"
      - uses: actions/setup-python@v5
        if: inputs.app_id == 'moss.knowledge-rag' && matrix.platform == 'linux-x64'
        with:
          python-version: '3.11'
      - name: Verify Linux RAG native dependencies from the hashed lock
        if: inputs.app_id == 'moss.knowledge-rag' && matrix.platform == 'linux-x64'
        run: |
          python -m venv "$RUNNER_TEMP/rag-linux"
          "$RUNNER_TEMP/rag-linux/bin/pip" install --require-hashes -r apps/knowledge-rag/resources/requirements.lock
          "$RUNNER_TEMP/rag-linux/bin/python" -c "import chromadb, fastembed, onnxruntime; c=chromadb.EphemeralClient(); s=c.create_collection('linux-smoke'); s.add(ids=['a'], embeddings=[[1.0,0.0]], documents=['Linux']); assert s.query(query_embeddings=[[1.0,0.0]], n_results=1)['ids']==[['a']]; assert 'CPUExecutionProvider' in onnxruntime.get_available_providers(); print('Linux Chroma/ONNX/FastEmbed native imports and vector query passed')"
      - name: Cache pinned CLI, MCP and model build dependencies
        if: matrix.platform == 'darwin-arm64' || matrix.platform == 'linux-x64'
        uses: actions/cache@v4
        with:
          path: ${{ env.MOSS_BUILD_DEPENDENCY_CACHE }}
          key: ${{ runner.os }}-${{ matrix.platform }}-bundled-engines-v1-${{ hashFiles('apps/*/resources/engine.json', 'apps/document-converter/resources/pdf-engine.json', 'apps/file-cleaner/resources/ff*.json', 'apps/transcription/resources/model.json') }}
      - name: Validate source and runtime on the target desktop platform
        if: steps.release.outputs.variants != 'true'
        run: node scripts/package-app.mjs --app "${{ steps.release.outputs.app_id }}"
      - name: Build signed platform package
        if: steps.release.outputs.variants == 'true'
        env:
          MOSS_APP_SIGNING_PRIVATE_KEY: ${{ secrets.MOSS_APP_SIGNING_PRIVATE_KEY }}
          MOSS_APP_SIGNING_KEY_ID: release-1
        run: node scripts/package-app.mjs --app "${{ inputs.app_id }}" --platform ${{ matrix.platform }} --require-signature
      - name: Verify bundled dependencies without external network
        if: contains(fromJSON('["moss.image-tools","moss.pdf-tools","moss.transcription","moss.file-cleaner","moss.document-converter","moss.code-map"]'), inputs.app_id) && (matrix.platform == 'darwin-arm64' || matrix.platform == 'linux-x64')
        run: node scripts/verify-bundled-apps.mjs --app "${{ inputs.app_id }}"
      - uses: actions/upload-artifact@v4
        if: always() && contains(fromJSON('["moss.image-tools","moss.pdf-tools","moss.transcription","moss.file-cleaner","moss.document-converter","moss.code-map"]'), inputs.app_id)
        with:
          name: offline-${{ inputs.app_id }}-${{ matrix.platform }}
          path: artifacts/offline-apps/*.json
      - name: Rebuild final archive independently
        run: node scripts/verify-source-package.mjs --app "${{ steps.release.outputs.app_id }}" --rebuild
      - name: Verify signed platform archive
        if: steps.release.outputs.variants == 'true'
        run: node scripts/verify-source-package.mjs --app "${{ inputs.app_id }}" --require-signature
      - name: Verify Windows native adapter in Electron
        if: steps.release.outputs.app_id == 'moss.computer-use' && runner.os == 'Windows'
        shell: bash
        run: |
          cd vendor/moss-core/ui
          bun install --frozen-lockfile
          node node_modules/electron/cli.js tests/native-control.electron.mjs --package="$GITHUB_WORKSPACE/artifacts/moss.computer-use/${{ steps.release.outputs.version }}/package-${{ matrix.platform }}" --host-trust
      - name: Upload verified platform release assets
        if: steps.release.outputs.variants == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.app_id }}-${{ inputs.version }}-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            artifacts/${{ inputs.app_id }}/*/*.zip
            artifacts/${{ inputs.app_id }}/*/*.sha256
            artifacts/${{ inputs.app_id }}/*/*.release.json
  release:
    needs: [context, source-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --filter moss-apps
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.app_id }}-v${{ inputs.version }}
        run: node scripts/release-context.mjs "$RELEASE_TAG"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - run: bun install --frozen-lockfile --filter moss-apps --filter "${{ steps.release.outputs.package_name }}"
      - run: node scripts/validate-apps.mjs --app "${{ steps.release.outputs.app_id }}"
      - run: node scripts/run-apps.mjs check --app "${{ steps.release.outputs.app_id }}"
      - run: node scripts/run-apps.mjs test --app "${{ steps.release.outputs.app_id }}"
      - name: Verify developer tools UI and local HTTP requests
        if: steps.release.outputs.app_id == 'moss.devtools'
        working-directory: apps/devtools
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Verify Trace UI and App data reader
        if: steps.release.outputs.app_id == 'moss.trace'
        working-directory: apps/trace
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Verify MCP connection management UI
        if: steps.release.outputs.app_id == 'moss.mcp'
        working-directory: apps/mcp
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Verify Browser Use UI
        if: steps.release.outputs.app_id == 'moss.browser-use'
        working-directory: apps/browser-use
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Verify Memory UI
        if: steps.release.outputs.app_id == 'moss.memory'
        working-directory: apps/memory
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Verify Audit UI and local database
        if: steps.release.outputs.app_id == 'moss.audit'
        working-directory: apps/audit
        run: |
          bun x playwright install --with-deps chromium
          bun run test:browser
      - name: Build signed App package
        if: steps.release.outputs.variants != 'true'
        env:
          MOSS_APP_SIGNING_PRIVATE_KEY: ${{ secrets.MOSS_APP_SIGNING_PRIVATE_KEY }}
          MOSS_APP_SIGNING_KEY_ID: release-1
        run: node scripts/package-app.mjs --app "${{ steps.release.outputs.app_id }}" --require-signature
      - name: Verify signed Audit package with the pinned Core Host
        if: steps.release.outputs.app_id == 'moss.audit'
        run: node apps/audit/scripts/verify-package.mjs --require-signature
      - name: Verify signed Workflow package with the pinned Core Host
        if: steps.release.outputs.app_id == 'moss.workflow'
        run: |
          node apps/workflow/scripts/verify-package.mjs --require-signature
          node apps/workflow/scripts/review-package.mjs --require-signature
      - name: Verify signed ZIP source and independent rebuild
        if: steps.release.outputs.variants != 'true'
        run: node scripts/verify-source-package.mjs --app "${{ steps.release.outputs.app_id }}" --rebuild --require-signature
      - name: Collect verified platform packages
        if: steps.release.outputs.variants == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-${{ inputs.app_id }}-${{ inputs.version }}-*
          merge-multiple: true
          path: artifacts/${{ inputs.app_id }}
      - name: Check all variants before publishing
        if: steps.release.outputs.variants == 'true'
        run: node scripts/verify-release-variants.mjs "${{ inputs.app_id }}" "${{ inputs.version }}"
      - name: Publish verified assets through a resumable draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_ID: ${{ inputs.app_id }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node scripts/publish-release.mjs --app "$APP_ID" --version "$VERSION" --source-sha "$SOURCE_SHA"
