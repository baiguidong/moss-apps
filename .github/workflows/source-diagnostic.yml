name: Diagnose source toolchain
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows-lock:
    runs-on: windows-latest
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - run: bun install --frozen-lockfile --filter moss-apps --filter "@moss/app-builder"
      - run: node scripts/diagnose-source-lock.mjs
      - run: node scripts/package-app.mjs --app moss.app-builder
      - run: node scripts/verify-source-package.mjs --app moss.app-builder --rebuild
