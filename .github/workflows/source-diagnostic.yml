name: Verify source toolchain
on:
  workflow_dispatch:
    inputs:
      app:
        description: App ID to build and independently rebuild
        required: true
        default: moss.openim
permissions:
  contents: read
jobs:
  source-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - run: bun install --frozen-lockfile
      - run: node scripts/package-app.mjs --app "${{ inputs.app }}"
      - run: node scripts/verify-source-package.mjs --app "${{ inputs.app }}" --rebuild
