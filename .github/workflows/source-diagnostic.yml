name: Verify source toolchain
on:
  workflow_dispatch:
    inputs:
      app:
        description: App ID to build and independently rebuild
        required: true
        default: moss.openim
permissions:
  contents: read
jobs:
  source-platforms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: macos-15, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: windows-latest, platform: win32-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve source bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.10-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.10-
      - name: Install build dependencies
        shell: bash
        env:
          APP_ID: ${{ inputs.app }}
        run: |
          case "$APP_ID" in
            moss.excel|moss.markitdown|moss.git) bun install --frozen-lockfile --filter moss-apps ;;
            *) bun install --frozen-lockfile ;;
          esac
      - id: target
        shell: bash
        env:
          APP_ID: ${{ inputs.app }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import { selectApps } from "./scripts/lib.mjs"; const app = selectApps(["--app", process.env.APP_ID])[0]; fs.appendFileSync(process.env.GITHUB_OUTPUT, "supported=" + (app.manifest.platforms || app.marketplace.platforms).includes(process.env.TARGET_PLATFORM) + "\n")'
      - if: steps.target.outputs.supported == 'true'
        run: node scripts/package-app.mjs --app "${{ inputs.app }}"
      - if: steps.target.outputs.supported == 'true'
        run: node scripts/verify-source-package.mjs --app "${{ inputs.app }}" --rebuild
      - name: Call portable MCP service on the target OS
        if: steps.target.outputs.supported == 'true' && contains(fromJSON('["moss.database","moss.excel","moss.markitdown","moss.git"]'), inputs.app)
        run: node scripts/verify-portable-services.mjs --app "${{ inputs.app }}"
      - name: Upload verified App packages
        if: steps.target.outputs.supported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ matrix.platform }}
          path: |
            artifacts/${{ inputs.app }}/**/*.zip
            artifacts/${{ inputs.app }}/**/*.release.json
          if-no-files-found: error
